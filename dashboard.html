<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard FPB Duty System</title>

    <link rel="stylesheet"
          href="dashboard.css">

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="topbar">

    <div>

        <h1>FPB DUTY SYSTEM</h1>

        <p>DASHBOARD</p>

    </div>


    <button
        type="button"
        onclick="logout()"
        class="btn-logout">

        LOGOUT

    </button>

</header>



<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="dashboard-container">


    <!-- =================================================
         MAKLUMAT POS
         ================================================= -->

    <section class="card">

        <h2>Maklumat Pos</h2>


        <div class="maklumat-grid">


            <div class="maklumat-item">

                <span class="label">
                    POS
                </span>

                <strong id="paparPos">
                    -
                </strong>

            </div>


            <div class="maklumat-item">

                <span class="label">
                    NAMA KETUA UNIT
                </span>

                <strong id="paparKetuaUnit">
                    -
                </strong>

            </div>


            <div class="maklumat-item">

                <span class="label">
                    NAMA KETUA POS
                </span>

                <strong id="paparKetuaPos">
                    -
                </strong>

            </div>


        </div>

    </section>



    <!-- =================================================
         SENARAI ANGGOTA
         ================================================= -->

    <section class="card">

        <div class="section-header">

            <div>

                <h2>
                    Senarai Anggota Pos
                </h2>

                <p id="jumlahAnggota">
                    0 ORANG
                </p>

            </div>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            BIL
                        </th>

                        <th>
                            NO. SKB
                        </th>

                        <th>
                            NO. ANGGOTA
                        </th>

                        <th>
                            NAMA
                        </th>

                        <th>
                            PANGKAT
                        </th>

                        <th>
                            JAWATAN
                        </th>

                    </tr>

                </thead>


                <tbody id="senaraiAnggota">

                    <tr>

                        <td colspan="6">
                            Memuatkan data...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="dashboard.js"></script>


</body>

</html>
