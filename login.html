<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        RK02 Wilayah Terengganu Online System
    </title>


    <style>

        /* =====================================================
           RESET
           ===================================================== */

        *{
            box-sizing:border-box;
        }


        html,
        body{

            margin:0;
            padding:0;

            width:100%;
            min-height:100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           BODY
           ===================================================== */

        body{

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            background:
                linear-gradient(
                    135deg,
                    #1f2933 0%,
                    #343a40 45%,
                    #111827 100%
                );

            padding:20px;

        }


        /* =====================================================
           BACKGROUND DECORATION
           ===================================================== */

        body::before{

            content:"";

            position:fixed;

            width:450px;
            height:450px;

            border-radius:50%;

            background:
                rgba(
                    255,
                    145,
                    0,
                    .08
                );

            top:-180px;
            right:-120px;

        }


        body::after{

            content:"";

            position:fixed;

            width:350px;
            height:350px;

            border-radius:50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .04
                );

            bottom:-150px;
            left:-120px;

        }


        /* =====================================================
           LOGIN WRAPPER
           ===================================================== */

        .login-wrapper{

            position:relative;

            z-index:2;

            width:100%;

            max-width:430px;

        }


        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .login-card{

            background:#ffffff;

            border-radius:18px;

            padding:38px 35px 30px;

            box-shadow:
                0 25px 60px
                rgba(
                    0,
                    0,
                    0,
                    .30
                );

        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo-box{

            width:78px;
            height:78px;

            margin:0 auto 20px;

            border-radius:18px;

            display:flex;

            align-items:center;

            justify-content:center;

            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #d97706
                );

            color:#fff;

            font-size:25px;

            font-weight:800;

            box-shadow:
                0 10px 25px
                rgba(
                    217,
                    119,
                    6,
                    .30
                );

        }

.logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}
        /* =====================================================
           TITLE
           ===================================================== */

        .login-title{

            text-align:center;

            margin-bottom:30px;

        }


        .login-title h1{

            margin:0;

            font-size:22px;

            color:#1f2933;

            letter-spacing:.5px;

        }


        .login-title p{

            margin:8px 0 0;

            font-size:12px;

            color:#6b7280;

            letter-spacing:1px;

        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group{

            margin-bottom:18px;

        }


        .form-group label{

            display:block;

            margin-bottom:7px;

            font-size:12px;

            font-weight:700;

            color:#374151;

        }


        .input-box{

            position:relative;

        }


        .input-box span{

            position:absolute;

            left:14px;

            top:50%;

            transform:
                translateY(-50%);

            font-size:15px;

            color:#9ca3af;

            pointer-events:none;

        }


        .input-box input{

            width:100%;

            height:48px;

            border:1px solid #d1d5db;

            border-radius:9px;

            padding:
                0 14px 0 42px;

            font-size:14px;

            outline:none;

            transition:.2s;

            background:#f9fafb;

        }


        .input-box input:focus{

            border-color:#f59e0b;

            background:#fff;

            box-shadow:
                0 0 0 3px
                rgba(
                    245,
                    158,
                    11,
                    .12
                );

        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .btn-login{

            width:100%;

            height:50px;

            border:0;

            border-radius:9px;

            margin-top:5px;

            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #d97706
                );

            color:#fff;

            font-size:14px;

            font-weight:700;

            letter-spacing:.5px;

            cursor:pointer;

            transition:.2s;

        }


        .btn-login:hover{

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(
                    217,
                    119,
                    6,
                    .25
                );

        }


        .btn-login:active{

            transform:
                translateY(0);

        }


        /* =====================================================
           RESET PASSWORD BUTTON
           ===================================================== */

        .btn-print{

            width:100%;

            height:42px;

            margin-top:12px;

            border:1px solid #d1d5db;

            border-radius:9px;

            background:#fff;

            color:#4b5563;

            font-size:12px;

            font-weight:700;

            cursor:pointer;

            transition:.2s;

        }


        .btn-print:hover{

            background:#f3f4f6;

            border-color:#9ca3af;

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .login-footer{

            text-align:center;

            margin-top:25px;

            padding-top:18px;

            border-top:
                1px solid #e5e7eb;

            font-size:10px;

            color:#9ca3af;

        }


        .login-footer strong{

            color:#6b7280;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media(max-width:500px){

            body{

                padding:15px;

            }


            .login-card{

                padding:
                    30px 22px 25px;

                border-radius:15px;

            }


            .logo-box{

                width:68px;
                height:68px;

                font-size:22px;

            }


            .login-title h1{

                font-size:19px;

            }

        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="login-card">


        <!-- =================================================
             LOGO
             ================================================= -->

        <div class="logo-box">

            <img src="assets/logo.png" alt="RK02 Logo">

        </div>



        <!-- =================================================
             TITLE
             ================================================= -->

        <div class="login-title">

            <h1>
                RK02 ONLINE SYSTEM
            </h1>

            <p>
                SISTEM PENGURUSAN RK02
            </p>

        </div>



        <!-- =================================================
             NO SKB
             ================================================= -->

        <div class="form-group">

            <label for="no_skb">
                NO. SKB
            </label>

            <div class="input-box">

                <span>👤</span>

                <input
                    id="no_skb"
                    type="text"
                    placeholder="Masukkan No. SKB"
                    autocomplete="username"
                >

            </div>

        </div>



        <!-- =================================================
             PASSWORD
             ================================================= -->

        <div class="form-group">

            <label for="password">
                PASSWORD
            </label>

            <div class="input-box">

                <span>🔒</span>

                <input
                    id="password"
                    type="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                >

            </div>

        </div>



        <!-- =================================================
             LOGIN
             ================================================= -->

        <button
            type="button"
            class="btn-login"
            onclick="login()"
        >

            LOGIN KE SISTEM

        </button>



        <!-- =================================================
             RESET PASSWORD
             ================================================= -->

        <button
            type="button"
            class="btn-print"
            onclick="resetPassword()"
        >

            RESET PASSWORD

        </button>



        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="login-footer">

            <strong>
                FPB DUTY COMMAND CENTER
            </strong>

            <br>

            Sistem Pengurusan Jadual Duty & Operasi

        </div>


    </div>


</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="./supabase-config.js"></script>


<script src="./login.js"></script>


</body>

</html>
