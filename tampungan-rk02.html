<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RK02 - Tampungan Pos</title>

<link rel="stylesheet" href="tampungan-rk02.css">

</head>


<body>


<div class="page-container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="page-header">

        <div>

            <div class="header-title">
                RK02 - TAMPUNGAN POS
            </div>

            <div class="header-subtitle">
                PAPARAN JAM DAN RM TAMPUNGAN ANGGOTA
            </div>

        </div>


        <div class="header-info">

            <div>
                POS :
                <strong id="namaPos">-</strong>
            </div>

            <div>
                BULAN :
                <strong id="bulanTahun">-</strong>
            </div>

        </div>

    </div>



    <!-- =====================================
         FILTER
    ====================================== -->

    <div class="filter-card">


        <div class="filter-group">

            <label>
                BULAN
            </label>

            <select id="bulan">

                <option value="1">JANUARI</option>
                <option value="2">FEBRUARI</option>
                <option value="3">MAC</option>
                <option value="4">APRIL</option>
                <option value="5">MEI</option>
                <option value="6">JUN</option>
                <option value="7">JULAI</option>
                <option value="8">OGOS</option>
                <option value="9">SEPTEMBER</option>
                <option value="10">OKTOBER</option>
                <option value="11">NOVEMBER</option>
                <option value="12">DISEMBER</option>

            </select>

        </div>



        <div class="filter-group">

            <label>
                TAHUN
            </label>

            <select id="tahun">

                <option value="2026">2026</option>
                <option value="2027">2027</option>

            </select>

        </div>



        <button
            type="button"
            id="btnPapar"
            class="btn-primary"
        >
            PAPAR
        </button>


        <button
            type="button"
            id="btnUpdate"
            class="btn-success"
        >
            KEMAS KINI RM KE SUPABASE
        </button>


    </div>



    <!-- =====================================
         STATUS
    ====================================== -->

    <div
        id="status"
        class="status-box"
    >
        Sila pilih bulan dan tahun kemudian tekan PAPAR.
    </div>



    <!-- =====================================
         JUMLAH KESELURUHAN
    ====================================== -->

    <div class="summary-card">


        <div class="summary-item">

            <span>
                JUMLAH ANGGOTA
            </span>

            <strong id="jumlahAnggota">
                0
            </strong>

        </div>


        <div class="summary-item">

            <span>
                JUMLAH JAM TAMPUNGAN
            </span>

            <strong id="jumlahJam">
                0.00 JAM
            </strong>

        </div>


        <div class="summary-item">

            <span>
                JUMLAH RM TAMPUNGAN
            </span>

            <strong id="jumlahRM">
                RM 0.00
            </strong>

        </div>


    </div>



    <!-- =====================================
         CARD ANGGOTA
    ====================================== -->

    <div
        id="senaraiAnggota"
        class="anggota-container"
    >

    </div>



</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="tampungan-rk02.js"></script>


</body>

</html>
